[package]
name = "uppsala"
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
description = "A pure Rust XML parser, DOM, namespace, XPath, and XSD validation library"
license = "BSD-2-Clause"
keywords = ["xml", "dom", "xpath", "xsd", "parser"]
repository = "https://github.com/kushaldas/uppsala"
readme = "README.md"
categories = ["parser-implementations", "encoding", "web-programming"]
exclude = ["test-data/", "perf.data"]

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
# Enable verbose `DEBUG: ...` traces on stderr. Off by default so library
# output stays clean. Currently emitted by the XSD validator submodule
# (identity constraint evaluation, attribute type resolution, etc.).
debug-logging = []
# Fuzz-only: exposes the internal SIMD scan halves (scalar + SSE2) and the
# serializer escaper via `uppsala::fuzz_exports`, so the differential fuzz
# harnesses in audit/fuzz can compare the paths directly. Adds no dependencies
# and is never enabled by normal or release builds.
fuzzing = []

[dependencies]

[dev-dependencies]
